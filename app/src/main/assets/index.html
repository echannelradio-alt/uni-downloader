<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Universal Downloader</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #0d0d0f;
      color: #f4f4f5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #16161a;
      border: 1px solid #27272a;
      border-radius: 16px;
      padding: 20px;
    }
    h1 { margin: 0 0 6px; font-size: 20px; }
    p.sub { margin: 0 0 16px; font-size: 13px; color: #a1a1aa; }
    .row { display: flex; gap: 8px; margin-bottom: 12px; }
    input, select {
      width: 100%;
      background: #0f0f12;
      color: #fff;
      border: 1px solid #2e2e36;
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 14px;
    }
    button.paste-btn {
      background: #27272a;
      color: #fff;
      border: 1px solid #3f3f46;
      border-radius: 10px;
      padding: 0 14px;
      cursor: pointer;
      white-space: nowrap;
    }
    .badge {
      display: inline-block;
      background: #ffffff;
      color: #09090b;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 999px;
      margin-bottom: 14px;
    }
    label { display: block; font-size: 12px; color: #a1a1aa; margin: 10px 0 6px; }
    button.main-btn {
      width: 100%;
      margin-top: 16px;
      background: #ffffff;
      color: #09090b;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .status {
      margin-top: 12px;
      font-size: 12px;
      color: #d4d4d8;
      min-height: 18px;
      line-height: 1.4;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Universal Downloader</h1>
    <p class="sub">Tempel link TikTok, Pinterest, IG, YouTube, FB, Threads, atau Spotify</p>

    <div class="row">
      <input id="urlInput" type="url" placeholder="https://..." />
      <button class="paste-btn" type="button" onclick="pasteUrl()">Tempel</button>
    </div>

    <div id="platformBadge" class="badge">Menunggu link...</div>

    <label for="formatSelect">Format File</label>
    <select id="formatSelect">
      <option value="mp4">MP4 (Video)</option>
      <option value="mp3">MP3 (Audio)</option>
    </select>

    <label for="qualitySelect">Resolusi / Kualitas</label>
    <select id="qualitySelect">
      <option value="1080p">1080p (Full HD)</option>
      <option value="720p">720p (HD)</option>
      <option value="480p">480p (SD)</option>
    </select>

    <button class="main-btn" type="button" onclick="startDownload()">Download Sekarang</button>
    <div id="statusMsg" class="status"></div>
  </div>

  <script>
    // Ganti URL ini jika ingin mengarah ke situs web tujuan lain
    const WEB_TARGET_URL = "https://cobalt.girlskissing.top";

    const urlInput = document.getElementById("urlInput");
    const badge = document.getElementById("platformBadge");
    const statusMsg = document.getElementById("statusMsg");

    function detectPlatform(rawUrl) {
      const u = rawUrl.toLowerCase();
      if (!u.trim()) return "Menunggu link...";
      if (u.includes("tiktok.com")) return "Terdeteksi: TikTok";
      if (u.includes("pinterest.com") || u.includes("pin.it")) return "Terdeteksi: Pinterest";
      if (u.includes("instagram.com")) return "Terdeteksi: Instagram";
      if (u.includes("youtube.com") || u.includes("youtu.be")) return "Terdeteksi: YouTube";
      if (u.includes("facebook.com") || u.includes("fb.watch")) return "Terdeteksi: Facebook";
      if (u.includes("threads.net") || u.includes("threads.com")) return "Terdeteksi: Threads";
      if (u.includes("spotify.com")) return "Terdeteksi: Spotify";
      return "Terdeteksi: Link Umum";
    }

    urlInput.addEventListener("input", () => {
      badge.textContent = detectPlatform(urlInput.value);
    });

    async function pasteUrl() {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          urlInput.value = text.trim();
          badge.textContent = detectPlatform(urlInput.value);
          statusMsg.textContent = "Link berhasil ditempel.";
        }
      } catch (e) {
        statusMsg.textContent = "Tekan lama di kolom link lalu pilih Tempel.";
      }
    }

    function startDownload() {
      const targetUrl = urlInput.value.trim();
      if (!targetUrl) {
        statusMsg.textContent = "Tempel link terlebih dahulu.";
        return;
      }
      const fmt = document.getElementById("formatSelect").value;
      const qual = document.getElementById("qualitySelect").value;

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(targetUrl).catch(() => {});
      }

      statusMsg.textContent = `Menyiapkan (${fmt.toUpperCase()} · ${qual}) & membuka halaman...`;
      window.location.href = WEB_TARGET_URL;
    }
  </script>
</body>
</html>
